name: Build & Deploy Repo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dpkg tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils

      - name: Generate Packages index
        run: |
          dpkg-scanpackages -m debs /dev/null > Packages
          gzip  -9kf Packages
          bzip2 -9kf Packages
          xz    -9kf Packages
          {
            echo "MD5Sum:"
            for f in Packages Packages.gz Packages.bz2 Packages.xz; do
              echo " $(md5sum $f | cut -d' ' -f1) $(stat -c%s $f) $f"
            done
            echo "SHA256:"
            for f in Packages Packages.gz Packages.bz2 Packages.xz; do
              echo " $(sha256sum $f | cut -d' ' -f1) $(stat -c%s $f) $f"
            done
          } >> Release

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
